services:
  db:
    image: postgres:16
    env_file: .env
    volumes: -pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    volumes: -upload:/app/storage

  frontend:
    build: ./frontend
    environment: -NEXT_PUBLIC_API_URL=/api
    depends_on: [backend]

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    depends_on: [frontend, backend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  uploads:
